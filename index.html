<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alight Motion Premium Mod - Download</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(160deg, #0f0a1a 0%, #1a0f2e 50%, #0d0a14 100%);
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .video-wrapper {
      max-width: 360px;
      margin: 0 auto;
      position: relative;
      border-radius: 22px;
      overflow: hidden;
      border: 2px solid rgba(192, 132, 252, 0.5);
      background: #000;
    }
    .video-wrapper::before {
      content: '';
      display: block;
      padding-top: 177.78%;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }
  </style>
</head>
<body class="text-white">
  <div class="max-w-md mx-auto px-5 py-10">

    <!-- Header -->
    <div class="flex justify-center mb-8">
      <div class="inline-flex items-center gap-3 glass px-5 py-3 rounded-2xl">
        <div class="w-11 h-11 bg-gradient-to-br from-violet-500 to-fuchsia-500 rounded-xl flex items-center justify-center">
          <i class="fas fa-magic text-xl"></i>
        </div>
        <div>
          <span class="font-bold text-xl tracking-wide">ALIGHT MOTION</span>
          <span class="block text-xs text-violet-300 -mt-0.5">PREMIUM MOD</span>
        </div>
      </div>
    </div>

    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold">Alight Motion Premium Mod</h1>
      <p class="text-violet-300 mt-2">Full Unlocked • No Watermark</p>
    </div>

    <!-- Warning -->
    <div class="glass rounded-2xl p-5 mb-8">
      <div class="flex gap-3">
        <i class="fas fa-exclamation-triangle text-2xl text-amber-400 mt-0.5"></i>
        <div>
          <p class="font-semibold text-amber-300">Wajib Tonton Video</p>
          <p class="text-gray-400 text-sm mt-1">Tonton tutorial dulu biar gak bingung pas install.</p>
        </div>
      </div>
    </div>

    <!-- Video -->
    <div class="mb-10">
      <div class="flex items-center justify-between mb-3 px-1">
        <span class="text-sm font-medium text-violet-300 flex items-center gap-2">
          <i class="fas fa-play-circle"></i> Tutorial Install
        </span>
        <span class="text-xs bg-violet-900/60 text-violet-300 px-3 py-1 rounded-full">9:16</span>
      </div>
      <div class="video-wrapper">
        <iframe src="https://aceimg.com/upload/?f=u6YutRUzG.mp4" 
                allowfullscreen allow="autoplay"></iframe>
      </div>
    </div>

    <!-- Download Button -->
    <button onclick="handleDownload()" id="downloadBtn"
            class="w-full py-6 bg-gradient-to-r from-violet-600 to-fuchsia-600 rounded-2xl text-xl font-bold flex items-center justify-center gap-3 shadow-lg shadow-violet-900/50 active:scale-95 transition-all">
      <i id="btnIcon" class="fas fa-download text-2xl"></i>
      <span id="btnText">DOWNLOAD SEKARANG</span>
    </button>

    <p class="text-center text-gray-500 text-xs mt-10">
      Link aman • Tonton video sampai selesai
    </p>
  </div>

  <script>
    function handleDownload() {
      const btn = document.getElementById('downloadBtn');
      const icon = document.getElementById('btnIcon');
      const text = document.getElementById('btnText');

      btn.disabled = true;
      icon.classList.remove('fa-download');
      icon.classList.add('fa-spinner', 'animate-spin');
      text.textContent = 'MEMPROSES...';

      window.open('https://move2link.co/2b17889', '_blank');

      setTimeout(() => {
        btn.disabled = false;
        icon.classList.remove('fa-spinner', 'animate-spin');
        icon.classList.add('fa-download');
        text.textContent = 'DOWNLOAD SEKARANG';
      }, 3000);
    }
  </script>
</body>
</html>
